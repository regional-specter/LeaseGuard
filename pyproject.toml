[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leaseguard-ai"
version = "0.1.0"
description = "Evidence-based intelligence for real-estate lease agreements."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "LeaseGuard Contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11,<3",
    "pypdf>=5.1,<6",
    "python-docx>=1.1,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leaseguard"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=leaseguard --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["leaseguard"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
